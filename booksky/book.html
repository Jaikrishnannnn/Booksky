<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" href="book.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar">
         <h1>BOOKSKY</h1>

    </div>

   
    <div class="container">
        <div class="bookcontainer">
            <h3>abc book</h3>
            <h5>jai</h5>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloribus ratione autem qui voluptates eum voluptatibus dolores, quibusdam consequuntur sed odio porro dolor! Iste animi a repudiandae odit error distinctio nobis!</p>
            <button  id="del" onclick="del(event)">Delete</button>
        </div>
    </div>
    
    <div class="overlay"></div>
    <div class="popupbox">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="book name" id="bookinput"><br><br>
            <input type="text" placeholder="author name" id="authorinput"><br><br>
            <textarea placeholder="book description" id="desinput"></textarea><br><br>
            <button class="addip" type="button">add</button><button  id="cancel">cancel</button>
        </form>
    </div> 
    <button class="addbtn" id="addpopup">+</button>









    <script src="book.js"></script>
    
</body>
</html>
